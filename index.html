<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; margin: 0; }
    h4 { margin: 0 0 8px 0; font-size: 13px; color: #333; }
    textarea { width: 100%; height: 100px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; resize: vertical; font-size: 13px; outline: none; }
    button { width: 100%; margin-top: 8px; padding: 10px; background-color: #0066ff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    button:hover { background-color: #0052cc; }
    #status { margin-top: 8px; font-size: 12px; text-align: center; font-weight: bold; min-height: 18px; }
  </style>
  <script src="https://unpkg.com/@livechat/agent-app-sdk@2.0.0/dist/agent-app-sdk.umd.js"></script>
</head>
<body>

  <h4>Müşteri Notu</h4>
  <textarea id="noteInput" placeholder="Not yazın..."></textarea>
  <button id="saveBtn">Kaydet</button>
  <div id="status"></div>

  <script>
    let currentCustomerKey = 'default_customer';

    function loadSavedNote() {
      const saved = localStorage.getItem(currentCustomerKey) || '';
      document.getElementById('noteInput').value = saved;
    }

    // LiveChat SDK Başlatma
    function initWidget() {
      if (window.LiveChat && typeof LiveChat.createDetailsWidget === 'function') {
        LiveChat.createDetailsWidget().then((widget) => {
          setStatus('Hazır', '#28a745');
          
          widget.on('customer_profile', (profile) => {
            if (profile && (profile.id || profile.email)) {
              currentCustomerKey = 'lc_note_' + (profile.email || profile.id);
              loadSavedNote();
            }
          });
        }).catch(() => {
          fallbackInit();
        });
      } else {
        fallbackInit();
      }
    }

    // SDK Başarısız Olursa B-Planı (URL'den müşteri tespiti)
    function fallbackInit() {
      setStatus('Hazır', '#28a745');
      const urlParams = new URLSearchParams(window.location.search);
      const cid = urlParams.get('customer_id') || urlParams.get('chat_id') || window.location.pathname;
      currentCustomerKey = 'lc_note_' + cid;
      loadSavedNote();
    }

    // Kaydet Butonu
    document.getElementById('saveBtn').addEventListener('click', () => {
      const text = document.getElementById('noteInput').value;
      localStorage.setItem(currentCustomerKey, text);
      
      setStatus('✅ Kaydedildi!', '#28a745');
      setTimeout(() => setStatus('', ''), 2000);
    });

    function setStatus(msg, color) {
      const el = document.getElementById('status');
      el.innerText = msg;
      el.style.color = color || '#333';
    }

    // Sayfa yüklenince çalıştır
    window.onload = function() {
      setTimeout(initWidget, 500);
    };
  </script>

</body>
</html>
