<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notlar</title>
<style>
  :root{
    --bg:#fff; --fg:#22262b; --muted:#767d85; --line:#e0e2e6;
    --card:#f7f8f9; --accent:#4384f5; --accent-fg:#fff; --danger:#d84f4f;
    --radius:8px;
  }
  html[data-theme="dark"]{
    --bg:#22262b; --fg:#eceff1; --muted:#9aa2ab; --line:#3a4048;
    --card:#2b3037; --accent:#5b95f7; --accent-fg:#fff; --danger:#e57373;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{padding:12px}
  .muted{color:var(--muted)}
  .small{font-size:11px}
  .state{padding:16px 4px; color:var(--muted); text-align:center}
  .state.err{color:var(--danger); text-align:left}
  .notes{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
  .note{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px}
  .note .meta{display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:4px}
  .note .who{font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .note .txt{white-space:pre-wrap; word-break:break-word}
  .note .acts{display:flex; gap:2px; flex:0 0 auto}
  .note.void{opacity:.6}
  .note.void .txt{text-decoration:line-through}
  .voidnote{margin-top:4px; font-size:11px; color:var(--muted); font-style:italic}
  .iconbtn{
    background:none; border:0; color:var(--muted); cursor:pointer; padding:2px 4px;
    font-size:11px; border-radius:4px; white-space:nowrap;
  }
  .iconbtn:hover{background:var(--line); color:var(--fg)}
  .iconbtn.danger:hover{background:var(--danger); color:#fff}
  textarea{
    width:100%; min-height:64px; resize:vertical; padding:8px 10px; color:var(--fg);
    background:var(--bg); border:1px solid var(--line); border-radius:var(--radius);
    font:inherit; outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  .row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px}
  .btn{
    background:var(--accent); color:var(--accent-fg); border:0; border-radius:var(--radius);
    padding:7px 14px; font:inherit; font-weight:600; cursor:pointer;
  }
  .btn:disabled{opacity:.5; cursor:default}
  .btn.ghost{background:none; color:var(--muted); font-weight:400; padding:7px 8px}
  .btn.ghost:hover{color:var(--fg)}
  .empty{padding:10px 2px; color:var(--muted)}
  .banner{
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--danger);
    border-radius:var(--radius); padding:8px 10px; margin-bottom:10px; font-size:12px;
  }
  .center{text-align:center; padding:20px 8px}
  .hist{margin-top:6px; padding-top:10px; border-top:1px dashed var(--line);
        display:flex; flex-direction:column; gap:6px}
  .hist-title{margin-bottom:2px}
  .note.old{background:none; border-style:dashed; opacity:.85}
</style>
</head>
<body>
<div id="app">
  <div id="state" class="state">Yükleniyor…</div>

  <div id="auth" class="center" hidden>
    <p class="muted">Notları görmek için LiveChat hesabınla bağlan.</p>
    <button id="connect" class="btn">Bağlan</button>
  </div>

  <div id="main" hidden>
    <div id="banner" class="banner" hidden></div>
    <div id="notes" class="notes"></div>
    <textarea id="input" placeholder="Bu sohbet hakkında not…" maxlength="2000"></textarea>
    <div class="row">
      <span id="counter" class="muted small"></span>
      <span>
        <button id="cancel" class="btn ghost" hidden>Vazgeç</button>
        <button id="save" class="btn">Ekle</button>
      </span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@livechat/agent-app-sdk@1.16.0/dist/agentapp.umd.min.js"></script>
<script src="https://unpkg.com/@livechat/accounts-sdk@3.0.2/dist/accounts-sdk.min.js"></script>
<script>
/* ==================================================================== *
 *  MARKALAR
 *  Her markanın kendi LiveChat hesabında ayrı bir uygulaması, yani ayrı
 *  bir Client ID var. Widget adresine ?b=<anahtar> ekleyerek hangi marka
 *  olduğunu söylüyoruz:  https://.../?b=bettilt
 *  Notlar her markanın kendi hesabında durur, markalar arasında karışmaz.
 * ==================================================================== */
var BRANDS = {
  bahsegel:   { CLIENT_ID: 'e60b10aab9458201f43cada83909f79b' },
  bettilt:    { CLIENT_ID: '' },
  casinomhub: { CLIENT_ID: '' },
  rokubet:    { CLIENT_ID: '' },
  paribahis:  { CLIENT_ID: '' },
  // trbet ve bircasino AYNI LiveChat hesabı: ikisine de o hesabın ID'sini yaz.
  trbet:      { CLIENT_ID: '' },
  bircasino:  { CLIENT_ID: '' }
};
var DEFAULT_BRAND = 'bahsegel';

/* --------------------------- ORTAK AYARLAR -------------------------- */
var CFG = {
  CLIENT_ID: '',
  BRAND:     '',
  PROPERTY:  'chat_note',        // notların tutulduğu property
  PLAYER_PROP: 'player_id',      // oyuncu kimliğinin yazıldığı property
  TAG:       'not',              // not varken atanan etiket ('' = kapalı)
  API:       'https://api.livechatinc.com/v3.6',
  SCOPES:    'chats--access:ro,chats--access:rw,agents--all:ro',
  REDIRECT:  '',
  REGION:    '',
  MAX_NOTE:  2000,
  SEARCH_LIMIT: 50,              // oyuncu geçmişinde taranacak sohbet sayısı
  SECTION:   true,
  SECTION_TITLE: 'Notlar',       // Console > Initial state içindeki title ile aynı olmalı
  TOAST:     true
};

// Custom variable'da oyuncu kimliğini taşıyabilecek alan adları.
var PLAYER_KEYS = ['playerid', 'playerno', 'userid', 'memberid'];

/* ==================================================================== */
var $ = function (id) { return document.getElementById(id); };

var widget = null;
var token = null;
var me = null;
var ctx = null;          // { chatId, threadId, email, custId, playerId }
var notes = [];          // birleşik liste; her notta _c = bulunduğu sohbet
var editing = null;      // düzenlenen not nesnesi
var busy = false;
var toastedChat = null;
// Sohbet geçişlerinde customer_profile birden fazla kez tetiklenebiliyor. Her
// yüklemeye bir nesil numarası veriyoruz; geç dönen eski yüklemenin sonucu atılır,
// yoksa aynı notlar listeye iki kez eklenir.
var gen = 0;
var TOKEN_KEY = '';

/* ---------- yardımcılar ---------- */
function show(which) {
  ['state', 'auth', 'main'].forEach(function (id) { $(id).hidden = (id !== which); });
}
function setState(msg, isError) {
  $('state').textContent = msg;
  $('state').className = 'state' + (isError ? ' err' : '');
  show('state');
}
function banner(msg) {
  var b = $('banner');
  if (!msg) { b.hidden = true; b.textContent = ''; return; }
  b.textContent = msg; b.hidden = false;
}
function fmt(ts) {
  try {
    return new Date(ts).toLocaleString('tr-TR',
      { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ''; }
}
function trim(s, n) {
  s = String(s || '').replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}
function safeGet(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { window.sessionStorage.setItem(k, v); } catch (e) {} }
function safeDel(k) { try { window.sessionStorage.removeItem(k); } catch (e) {} }
function nid() {
  return Date.now().toString(36) + '-' + Math.floor(Math.random() * 1679616).toString(36);
}
function looksLikeEmail(v) { return typeof v === 'string' && v.indexOf('@') > -1; }
function normKey(k) { return String(k || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

/* ---------- marka çözümleme ---------- */
function pickBrand() {
  var key = '';
  try {
    key = (new URLSearchParams(window.location.search).get('b') || '').trim().toLowerCase();
  } catch (e) { key = ''; }
  if (!key) key = DEFAULT_BRAND;
  var brand = BRANDS[key];
  if (!brand) return 'Bilinmeyen marka: "' + key + '". Geçerli anahtarlar: ' + Object.keys(BRANDS).join(', ');
  if (!/^[0-9a-f]{32}$/i.test(String(brand.CLIENT_ID || ''))) {
    return '"' + key + '" markasının Client ID\'si girilmemiş. index.html içindeki BRANDS listesini doldur.';
  }
  CFG.BRAND = key;
  CFG.CLIENT_ID = brand.CLIENT_ID;
  ['PROPERTY', 'PLAYER_PROP', 'TAG', 'REGION', 'SECTION', 'TOAST', 'SEARCH_LIMIT'].forEach(function (k) {
    if (brand[k] !== undefined) CFG[k] = brand[k];
  });
  TOKEN_KEY = 'lcnotes.token.' + CFG.CLIENT_ID;
  return null;
}

/* ---------- yetkilendirme ---------- */
function cachedToken() {
  var raw = safeGet(TOKEN_KEY);
  if (!raw) return null;
  try {
    var o = JSON.parse(raw);
    if (o && o.token && o.exp > Date.now() + 30000) return o.token;
  } catch (e) {}
  safeDel(TOKEN_KEY);
  return null;
}
function storeToken(data) {
  token = data.access_token;
  var ttl = (parseInt(data.expires_in, 10) || 3600) * 1000;
  safeSet(TOKEN_KEY, JSON.stringify({ token: token, exp: Date.now() + ttl }));
  return token;
}
function redirectUri() {
  if (CFG.REDIRECT) return CFG.REDIRECT;
  return window.location.origin + window.location.pathname;
}
function accounts() {
  var opts = {
    client_id: CFG.CLIENT_ID,
    redirect_uri: redirectUri(),
    response_type: 'token',
    transaction: { force_local_storage: true }
  };
  if (CFG.SCOPES) opts.scope = CFG.SCOPES;
  return new AccountsSDK(opts);
}
function authSilent() {
  var c = cachedToken();
  if (c) { token = c; return Promise.resolve(token); }
  return accounts().iframe().authorize()
    .then(function (d) { return (d && d.access_token) ? storeToken(d) : null; })
    .catch(function () { return null; });
}
function authPopup() {
  return accounts().popup().authorize()
    .then(function (d) { return (d && d.access_token) ? storeToken(d) : null; });
}
function whoAmI() {
  if (me !== null) return Promise.resolve(me);
  me = '';
  return fetch('https://accounts.livechat.com/v2/info', {
    headers: { Authorization: 'Bearer ' + token }
  }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (info) {
      if (looksLikeEmail(info && info.entity_id)) { me = info.entity_id; return me; }
      if (looksLikeEmail(info && info.email)) { me = info.email; return me; }
      var accId = info && info.account_id;
      if (!accId) return me;
      return api('list_agents', {}, 'configuration').then(function (res) {
        var list = Array.isArray(res) ? res : ((res && res.agents) || []);
        for (var i = 0; i < list.length; i++) {
          if (list[i] && list[i].account_id === accId) { me = list[i].name || list[i].id || ''; break; }
        }
        return me;
      }).catch(function () { return me; });
    })
    .catch(function () { return me; });
}

/* ---------- API ---------- */
function api(action, payload, group) {
  var headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token };
  if (CFG.REGION) headers['X-Region'] = CFG.REGION;
  return fetch(CFG.API + '/' + (group || 'agent') + '/action/' + action, {
    method: 'POST', headers: headers, body: JSON.stringify(payload || {})
  }).then(function (r) {
    if (r.status === 401) { token = null; safeDel(TOKEN_KEY); var e = new Error('unauthorized'); e.auth = true; throw e; }
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw new Error((j && j.error && (j.error.message || j.error.type)) || ('HTTP ' + r.status));
      return j;
    });
  });
}

/* ---------- not verisi ---------- */
function parseNotes(holder) {
  var bag = holder && holder.properties && holder.properties[CFG.CLIENT_ID];
  var raw = bag && bag[CFG.PROPERTY];
  if (!raw) return [];
  try {
    var v = JSON.parse(raw);
    if (Array.isArray(v)) return v;
    if (typeof v === 'string' && v) return [{ t: 0, a: '', x: v }];
  } catch (e) {
    return [{ t: 0, a: '', x: String(raw) }];
  }
  return [];
}
function normalize(list, chatId) {
  return (list || []).map(function (n, i) {
    if (!n || typeof n !== 'object') n = { t: 0, a: '', x: String(n || '') };
    if (!n.i) n.i = 'l' + (n.t || 0) + '-' + i;
    if (chatId) n._c = chatId;
    return n;
  });
}
function strip(n) {
  var o = {};
  for (var k in n) if (k !== '_c' && Object.prototype.hasOwnProperty.call(n, k)) o[k] = n[k];
  return o;
}
function byId(list, id) {
  for (var i = 0; i < list.length; i++) if (list[i].i === id) return i;
  return -1;
}
function liveNotes() { return notes.filter(function (n) { return !n.v; }); }
function dedupe(list) {
  var seen = {}, out = [];
  (list || []).forEach(function (n) {
    var k = (n._c || '') + '|' + n.i;
    if (seen[k]) return;
    seen[k] = 1; out.push(n);
  });
  return out;
}
function sortNotes(list) {
  list.sort(function (a, b) { return (b.t || 0) - (a.t || 0); });
  return list;
}

/* ---------- oyuncu kimliği ---------- *
 * Sohbetin custom variable'larında playerId geliyor. Bu kimlik, müşteri
 * cihaz/tarayıcı değiştirse bile sabit kaldığı için notları ona bağlıyoruz. */
function pickFromPairs(pairs) {
  pairs = pairs || [];
  for (var i = 0; i < pairs.length; i++) {
    var p = pairs[i];
    if (!p || typeof p !== 'object') continue;
    if ('key' in p && 'value' in p) {
      if (PLAYER_KEYS.indexOf(normKey(p.key)) > -1 && p.value) return String(p.value);
      continue;
    }
    for (var k in p) {
      if (PLAYER_KEYS.indexOf(normKey(k)) > -1 && p[k]) return String(p[k]);
    }
  }
  return '';
}
function playerFromProfile(profile) {
  var cv = profile && (profile.customVariables || profile.custom_variables);
  if (!cv) return '';
  if (Array.isArray(cv)) return pickFromPairs(cv);
  if (typeof cv === 'object') return pickFromPairs([cv]);
  return '';
}
function playerFromChat(chat) {
  var users = (chat && chat.users) || [];
  for (var i = 0; i < users.length; i++) {
    if (users[i] && users[i].type === 'customer') {
      var v = pickFromPairs(users[i].session_fields);
      if (v) return v;
    }
  }
  var bag = chat && chat.properties && chat.properties[CFG.CLIENT_ID];
  if (bag && bag[CFG.PLAYER_PROP]) return String(bag[CFG.PLAYER_PROP]);
  return '';
}

/* ---------- yükleme ---------- */
function loadChat(chatId, threadHint, profile) {
  var payload = { chat_id: chatId };
  if (threadHint) payload.thread_id = threadHint;
  return api('get_chat', payload).then(function (chat) {
    var thread = chat.thread || {};
    ctx = {
      chatId: chat.id || chatId,
      threadId: thread.id || threadHint,
      email: (profile && profile.email) || '',
      custId: (profile && profile.id) || '',
      playerId: playerFromProfile(profile) || playerFromChat(chat) || ''
    };
    var found = parseNotes(chat);
    if (!found.length) found = parseNotes(thread);
    notes = normalize(found, ctx.chatId);
    if (!ctx.threadId) throw new Error('Bu sohbette kayıt yapılabilir bir thread bulunamadı.');
  });
}

// Oyuncunun diğer sohbetlerindeki notlar. Arşiv metin aramasında playerId
// indeksli olduğu için tek çağrıyla bulunuyor; dönen her kayıt kod tarafında
// gerçekten aynı oyuncuya ait mi diye doğrulanıyor.
function loadPlayerNotes() {
  var pid = ctx && ctx.playerId;
  if (!pid) return Promise.resolve([]);

  var withTag = { filters: { query: String(pid) }, limit: CFG.SEARCH_LIMIT, sort_order: 'desc' };
  if (CFG.TAG) withTag.filters.tags = { values: [CFG.TAG] };

  var collect = function (chats) {
    var out = [], seen = {};
    (chats || []).forEach(function (c) {
      if (!c || !c.id || c.id === ctx.chatId || seen[c.id]) return;
      seen[c.id] = 1;
      if (playerFromChat(c) !== String(pid)) return;      // yanlış eşleşmeyi ele
      var found = parseNotes(c);
      if (!found.length && c.thread) found = parseNotes(c.thread);
      if (!found.length) return;
      normalize(found, c.id).forEach(function (n) { out.push(n); });
    });
    return out;
  };

  return api('list_archives', withTag)
    .then(function (res) {
      var got = collect(res.chats);
      if (got.length || !CFG.TAG) return got;
      // etiketi düşmemiş eski sohbetler olabilir: etiket filtresi olmadan bir daha
      return api('list_archives', {
        filters: { query: String(pid) }, limit: CFG.SEARCH_LIMIT, sort_order: 'desc'
      }).then(function (r2) { return collect(r2.chats); });
    })
    .catch(function () { return []; });
}

/* ---------- yazma ---------- *
 * Notun yaşadığı sohbete yazar. Kaydetmeden önce o sohbeti yeniden okur,
 * böylece arada başka bir agent not eklediyse kaybolmaz.                 */
function commitTo(chatId, op) {
  if (busy || !ctx) return Promise.resolve();
  busy = true; banner(''); syncComposer();
  return api('get_chat', { chat_id: chatId })
    .then(function (chat) {
      var cur = parseNotes(chat);
      if (!cur.length) cur = parseNotes(chat.thread || {});
      var next = op(normalize(cur, chatId));
      var bag = {};
      bag[CFG.PROPERTY] = JSON.stringify(next.map(strip));
      if (chatId === ctx.chatId && ctx.playerId) bag[CFG.PLAYER_PROP] = String(ctx.playerId);
      var props = {}; props[CFG.CLIENT_ID] = bag;
      return api('update_chat_properties', { id: chatId, properties: props })
        .then(function () {
          notes = sortNotes(dedupe(
            notes.filter(function (n) { return n._c !== chatId; })
                 .concat(normalize(next, chatId))
          ));
        });
    })
    .then(function () {
      if (!CFG.TAG || chatId !== ctx.chatId) return null;
      var mineHere = notes.filter(function (n) { return n._c === ctx.chatId && !n.v; }).length;
      return api(mineHere ? 'tag_thread' : 'untag_thread',
        { chat_id: ctx.chatId, thread_id: ctx.threadId, tag: CFG.TAG }).catch(function () { return null; });
    })
    .then(function () { busy = false; render(); })
    .catch(function (err) {
      busy = false; render();
      if (err && err.auth) { show('auth'); return; }
      banner('Kaydedilemedi: ' + (err && err.message ? err.message : 'bilinmeyen hata'));
    });
}

function addNote(text) {
  return commitTo(ctx.chatId, function (list) {
    list.unshift({ i: nid(), t: Date.now(), a: me || '', x: text });
    return list;
  });
}
function editNote(note, text) {
  return commitTo(note._c || ctx.chatId, function (list) {
    var k = byId(list, note.i);
    if (k < 0) { list.unshift({ i: nid(), t: Date.now(), a: me || '', x: text }); return list; }
    list[k].x = text; list[k].e = Date.now();
    return list;
  });
}
function deleteNote(note) {
  return commitTo(note._c || ctx.chatId, function (list) {
    var k = byId(list, note.i);
    if (k > -1) list.splice(k, 1);
    return list;
  });
}
function voidNote(note, undo) {
  return commitTo(note._c || ctx.chatId, function (list) {
    var k = byId(list, note.i);
    if (k < 0) return list;
    if (undo) delete list[k].v;
    else list[k].v = { a: me || '', t: Date.now() };
    return list;
  });
}

/* ---------- Agent App görünürlüğü ---------- */
function updateSection() {
  if (!widget || !CFG.SECTION || typeof widget.modifySection !== 'function') return;
  var live = liveNotes();
  var comps = [];
  if (live.length) {
    var last = live[0];
    comps.push({ type: 'label_value', data: {
      label: live.length + ' not · ' + (last.a || 'Agent'),
      value: trim(last.x, 90)
    }});
  } else {
    comps.push({ type: 'label_value', data: { label: 'Not yok', value: '—' } });
  }
  comps.push({ type: 'button', data: {
    label: live.length ? 'Notları aç' : 'Not ekle',
    id: 'open-notes', openApp: true, primary: true
  }});
  try {
    // title sabit: bölümün kimliği. Değişirse çağrı hiçbir bölüme denk gelmez.
    widget.modifySection({ title: CFG.SECTION_TITLE, components: comps });
  } catch (e) {}
}
function maybeToast() {
  if (!CFG.TOAST || !widget || typeof widget.setToast !== 'function') return;
  var n = liveNotes().length;
  if (!n || !ctx || toastedChat === ctx.chatId) return;
  toastedChat = ctx.chatId;
  try { widget.setToast({ content: 'Bu üye için ' + n + ' not var', kind: 'success' }); } catch (e) {}
}

/* ---------- arayüz ---------- */
function mkBtn(label, cls, fn) {
  var b = document.createElement('button');
  b.type = 'button'; b.className = cls; b.textContent = label; b.onclick = fn;
  return b;
}
function noteCard(n) {
  var card = document.createElement('div');
  card.className = 'note' + (n.v ? ' void' : '');

  var meta = document.createElement('div');
  meta.className = 'meta';

  var who = document.createElement('span');
  who.className = 'who';
  who.textContent = [n.a || 'Agent', n.t ? fmt(n.t) : '', n.e ? '(düzenlendi)' : '']
    .filter(Boolean).join(' · ');
  meta.appendChild(who);

  var acts = document.createElement('span');
  acts.className = 'acts';
  var mine = !!(me && n.a === me);
  if (mine && !n.v) acts.appendChild(mkBtn('Düzenle', 'iconbtn', function () { startEdit(n); }));
  if (n.v) acts.appendChild(mkBtn('Geri al', 'iconbtn', function () { voidNote(n, true); }));
  else acts.appendChild(mkBtn('Geçersiz kıl', 'iconbtn', function () { voidNote(n, false); }));
  if (mine) acts.appendChild(mkBtn('Sil', 'iconbtn danger', function () { deleteNote(n); }));
  meta.appendChild(acts);
  card.appendChild(meta);

  var txt = document.createElement('div');
  txt.className = 'txt';
  txt.textContent = n.x || '';
  card.appendChild(txt);

  if (n.v) {
    var v = document.createElement('div');
    v.className = 'voidnote';
    v.textContent = (n.v.a || 'Bir agent') + ' geçersiz kıldı' + (n.v.t ? ' · ' + fmt(n.v.t) : '');
    card.appendChild(v);
  }
  return card;
}
function render() {
  var box = $('notes');
  box.textContent = '';
  if (!notes.length) {
    var e = document.createElement('div');
    e.className = 'empty small';
    e.textContent = 'Bu üye için henüz not yok.';
    box.appendChild(e);
  }
  notes.forEach(function (n) { box.appendChild(noteCard(n)); });
  syncComposer();
  updateSection();
}
function syncComposer() {
  var len = $('input').value.length;
  $('counter').textContent = len ? (len + ' / ' + CFG.MAX_NOTE) : '';
  $('save').textContent = editing ? 'Güncelle' : 'Ekle';
  $('save').disabled = busy || !$('input').value.trim();
  $('cancel').hidden = !editing;
  $('input').disabled = busy;
}
function startEdit(n) {
  editing = n;
  $('input').value = n.x || '';
  $('input').focus();
  syncComposer();
}
function cancelEdit() {
  editing = null; $('input').value = ''; syncComposer();
}
function submit() {
  var text = $('input').value.trim();
  if (!text || busy) return;
  var target = editing;
  editing = null; $('input').value = '';
  return target ? editNote(target, text) : addNote(text);
}

/* ---------- açılış ---------- */
function openProfile(profile) {
  var chat = (profile && profile.chat) || {};
  var chatId = chat.chat_id || chat.id;
  var threadHint = chat.chat_id ? chat.id : null;

  if (!chatId) { setState('Bu görünümde bağlı bir sohbet yok.'); return; }
  if (!token) { show('auth'); return; }

  var myGen = ++gen;
  var stale = function () { return myGen !== gen; };

  setState('Notlar yükleniyor…');
  whoAmI()
    .then(function () { if (stale()) return null; return loadChat(chatId, threadHint, profile); })
    .then(function () {
      if (stale()) return null;
      editing = null; $('input').value = '';
      notes = dedupe(notes);
      show('main'); banner(''); render();
      // oyuncunun diğer sohbetlerindeki notlar aynı listeye karışır
      return loadPlayerNotes().then(function (extra) {
        if (stale()) return null;
        if (extra.length) { notes = sortNotes(dedupe(notes.concat(extra))); render(); }
        maybeToast();
        return null;
      });
    })
    .catch(function (err) {
      if (stale()) return;
      if (err && err.auth) { show('auth'); return; }
      setState('Notlar açılamadı: ' + (err && err.message ? err.message : 'bilinmeyen hata'), true);
    });
}

function boot() {
  if (window.opener && window.location.hash.indexOf('access_token') > -1) {
    setState('Bağlantı tamamlandı, bu pencere kapanacak…');
    return;
  }
  if (!window.LiveChat || !window.LiveChat.createDetailsWidget) {
    setState('Bu sayfa LiveChat Agent App içinde çalışacak şekilde tasarlandı.', true);
    return;
  }
  var problem = pickBrand();
  if (problem) { setState('Kurulum eksik: ' + problem, true); return; }

  $('input').addEventListener('input', syncComposer);
  $('input').addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
  });
  $('save').addEventListener('click', submit);
  $('cancel').addEventListener('click', cancelEdit);

  window.LiveChat.createDetailsWidget().then(function (w) {
    widget = w;
    var applyTheme = function (t) { if (t) document.documentElement.setAttribute('data-theme', t); };
    try { applyTheme(widget.getTheme && widget.getTheme()); } catch (e) {}
    widget.on('change_theme', function (d) { applyTheme(d && d.theme); });

    $('connect').addEventListener('click', function () {
      setState('Bağlanıyor…');
      authPopup()
        .then(function (t) {
          if (!t) { show('auth'); return; }
          openProfile(widget.getCustomerProfile && widget.getCustomerProfile());
        })
        .catch(function () { show('auth'); });
    });

    widget.on('customer_profile', openProfile);

    authSilent().then(function () {
      var p = widget.getCustomerProfile && widget.getCustomerProfile();
      if (p) openProfile(p);
      else if (!token) show('auth');
      else setState('Bir sohbet seç.');
    });
  }).catch(function () {
    setState('Agent App bağlantısı kurulamadı.', true);
  });
}

boot();
</script>
