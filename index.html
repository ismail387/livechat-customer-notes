<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #fff;
    }
    h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      resize: vertical;
      font-size: 13px;
      outline: none;
    }
    textarea:focus {
      border-color: #4285f4;
    }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      background-color: #0066ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background-color: #0052cc;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #28a745;
      text-align: center;
      min-height: 16px;
      font-weight: 500;
    }
  </style>
  <script src="https://unpkg.com/@livechat/agent-app-sdk@2.0.0/dist/agent-app-sdk.umd.js"></script>
</head>
<body>

  <h4>Müşteri Notu</h4>
  <textarea id="noteInput" placeholder="Bu müşteri için not yazın..."></textarea>
  <button id="saveBtn">Notu Kaydet</button>
  <div id="status"></div>

  <script>
    let currentKey = null;

    // SDK Başlatma
    if (window.LiveChat) {
      LiveChat.createDetailsWidget().then((widget) => {

        // Müşteri profili değiştikçe tetiklenir
        widget.on('customer_profile', (profile) => {
          if (!profile) return;

          // Müşteriyi e-postasına veya ID'sine göre tekilleştir
          currentKey = 'note_' + (profile.email || profile.id);

          // Hafızadaki notu çek ve kutuya yaz
          const savedNote = localStorage.getItem(currentKey) || '';
          document.getElementById('noteInput').value = savedNote;
          setStatus('');
        });

      }).catch((err) => {
        console.error('Widget hatası:', err);
      });
    }

    // Kaydet Buton Olayı
    document.getElementById('saveBtn').addEventListener('click', () => {
      const noteText = document.getElementById('noteInput').value;

      if (!currentKey) {
        // Müşteri profili henüz yüklenmediyse sohbet URL'sinden ID almayı dene
        currentKey = 'note_generic_' + window.location.search;
      }

      // LocalStorage'a yaz
      localStorage.setItem(currentKey, noteText);
      
      setStatus('✅ Kaydedildi!');
      setTimeout(() => setStatus(''), 2500);
    });

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }
  </script>

</body>
</html>
