<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; margin: 0; background: #fff; }
    h4 { margin: 0 0 4px 0; font-size: 13px; color: #333; }
    #customerTag { font-size: 11px; color: #0066ff; font-weight: bold; margin-bottom: 8px; display: block; word-break: break-all; }
    textarea { width: 100%; height: 110px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; resize: vertical; font-size: 13px; outline: none; }
    textarea:focus { border-color: #0066ff; }
    button { width: 100%; margin-top: 8px; padding: 10px; background-color: #0066ff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    button:hover { background-color: #0052cc; }
    #status { margin-top: 8px; font-size: 12px; text-align: center; font-weight: bold; min-height: 18px; }
  </style>
  <script src="https://unpkg.com/@livechat/agent-app-sdk@2.0.0/dist/agent-app-sdk.umd.js"></script>
</head>
<body>

  <h4>Müşteri Notu</h4>
  <span id="customerTag">Müşteri yükleniyor...</span>
  <textarea id="noteInput" placeholder="Bu müşteri için not yazın..."></textarea>
  <button id="saveBtn">Notu Kaydet</button>
  <div id="status"></div>

  <script>
    let currentKey = null;

    function setKeyAndLoad(identifier) {
      if (!identifier || currentKey === 'lc_note_v4_' + identifier) return;
      currentKey = 'lc_note_v4_' + identifier;
      document.getElementById('customerTag').innerText = '👤 ' + identifier;
      
      // Müşteriye özel kayıtlı notu yükle
      const saved = localStorage.getItem(currentKey) || '';
      document.getElementById('noteInput').value = saved;
      setStatus('Hazır', '#28a745');
    }

    // 1. SDK Yöntemi (Canlı Sohbetler İçin)
    if (window.LiveChat) {
      LiveChat.createDetailsWidget().then((widget) => {
        const handleData = (data) => {
          if (!data) return;
          const id = data.email || data.id || (data.customer && (data.customer.email || data.customer.id));
          if (id) setKeyAndLoad(id);
        };

        widget.on('customer_profile', handleData);
        widget.on('customer_details', handleData);
        widget.on('chat_details', handleData);
      }).catch(() => {});
    }

    // 2. Fallback Yöntemi (Arşiv Sohbetleri İçin URL & Referrer Takibi)
    setInterval(() => {
      try {
        // İframe URL parametrelerinden veya Referrer (üst sayfa) adresinden Sohbet/Müşteri ID'sini yakala
        const urlParams = new URLSearchParams(window.location.search);
        let id = urlParams.get('chat_id') || urlParams.get('customer_id');

        if (!id && document.referrer) {
          const refUrl = new URL(document.referrer);
          const parts = refUrl.pathname.split('/');
          id = parts[parts.length - 1]; // Örn: TK04QS5J9X
        }

        if (id && id !== 'new') {
          setKeyAndLoad(id);
        }
      } catch (e) {}
    }, 800);

    // Kaydet Butonu
    document.getElementById('saveBtn').addEventListener('click', () => {
      const text = document.getElementById('noteInput').value;

      if (!currentKey) {
        setStatus('❌ Müşteri seçili değil!', '#dc3545');
        return;
      }

      localStorage.setItem(currentKey, text);
      setStatus('✅ Not Kaydedildi!', '#28a745');
      setTimeout(() => setStatus('Hazır', '#28a745'), 2000);
    });

    function setStatus(msg, color) {
      const el = document.getElementById('status');
      el.innerText = msg;
      el.style.color = color || '#333';
    }
  </script>

</body>
</html>
