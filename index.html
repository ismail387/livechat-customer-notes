<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; margin: 0; }
    h4 { margin: 0 0 10px 0; color: #333; }
    textarea { width: 100%; height: 100px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    button { width: 100%; margin-top: 8px; padding: 10px; background-color: #4285f4; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #357ae8; }
    #status { margin-top: 8px; font-size: 12px; color: #666; }
  </style>
  <script src="https://unpkg.com/@livechat/agent-app-sdk@latest/dist/agent-app-sdk.min.js"></script>
</head>
<body>
  <h4>Müşteri Notları</h4>
  <textarea id="noteInput" placeholder="Müşteri hakkında not yazın..."></textarea>
  <button id="saveBtn">Kaydet</button>
  <div id="status"></div>

  <script>
    let widget = null;
    let currentCustomerId = null;

    // SDK Başlatma
    createDetailsWidget().then((instance) => {
      widget = instance;

      // Müşteri profil değişimi dinleyici
      widget.on('customer_profile', (profile) => {
        if (!profile) return;
        currentCustomerId = profile.id;
        
        // Varsa eski notu yükle
        const existingNote = profile.properties?.my_notes?.note || '';
        document.getElementById('noteInput').value = existingNote;
        showStatus('');
      });
    });

    // Kaydet Butonu
    document.getElementById('saveBtn').addEventListener('click', () => {
      if (!widget || !currentCustomerId) {
        showStatus('Müşteri bilgisi alınamadı!');
        return;
      }

      const noteText = document.getElementById('noteInput').value;
      showStatus('Kaydediliyor...');

      // Customer Property olarak kaydet
      widget.putCustomerProperty({
        id: currentCustomerId,
        namespace: 'my_notes',
        name: 'note',
        value: noteText
      })
      .then(() => {
        showStatus('✅ Not başarıyla kaydedildi!');
      })
      .catch((err) => {
        console.error(err);
        showStatus('❌ Kayıt başarısız: ' + (err.message || 'Yetki hatası'));
      });
    });

    function showStatus(msg) {
      document.getElementById('status').innerText = msg;
    }
  </script>
</body>
</html>
