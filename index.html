<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; margin: 0; background-color: #f9f9f9; }
    h4 { margin: 0 0 10px 0; color: #2c3e50; font-size: 14px; }
    textarea { width: 100%; height: 110px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; resize: vertical; font-size: 13px; }
    button { width: 100%; margin-top: 10px; padding: 10px; background-color: #4285f4; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    button:hover { background-color: #357ae8; }
    #status { margin-top: 10px; font-size: 12px; color: #555; text-align: center; }
  </style>
  <!-- Doğru UMD CDN Bağlantısı -->
  <script src="https://unpkg.com/@livechat/agent-app-sdk@2.0.0/dist/agent-app-sdk.umd.js"></script>
</head>
<body>
  <h4>Müşteri Notları</h4>
  <textarea id="noteInput" placeholder="Müşteri hakkında not yazın..."></textarea>
  <button id="saveBtn">Kaydet</button>
  <div id="status"></div>

  <script>
    let widgetInstance = null;
    let currentCustomerId = null;

    // SDK Başlatma
    if (window.LiveChat) {
      LiveChat.createDetailsWidget().then((widget) => {
        widgetInstance = widget;
        showStatus('Hazır');

        // Müşteri seçildiğinde mevcut notu yükle
        widget.on('customer_profile', (profile) => {
          if (!profile) return;
          currentCustomerId = profile.id;
          
          // Müşteriye ait not varsa getir
          const existingNote = profile.properties?.my_notes?.note || '';
          document.getElementById('noteInput').value = existingNote;
          showStatus('');
        });
      }).catch((err) => {
        showStatus('SDK Bağlantı Hatası!');
      });
    }

    // Kaydet Butonu
    document.getElementById('saveBtn').addEventListener('click', () => {
      if (!widgetInstance) {
        showStatus('Widget başlatılamadı.');
        return;
      }

      const noteText = document.getElementById('noteInput').value;
      showStatus('Kaydediliyor...');

      // LiveChat Property kaydı
      widgetInstance.putCustomerProperty({
        namespace: 'my_notes',
        name: 'note',
        value: noteText
      })
      .then(() => {
        showStatus('✅ Not kaydedildi!');
      })
      .catch((err) => {
        console.error(err);
        showStatus('❌ Kayıt başarısız!');
      });
    });

    function showStatus(msg) {
      document.getElementById('status').innerText = msg;
    }
  </script>
</body>
</html>
